<script>
const nativeRandom = Math.random.bind(Math);
let ACTIVE_RNG = null;
function hashSeed(value){
  let h=2166136261>>>0;
  for(const ch of String(value)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
  return h>>>0 || 1;
}
class SeededRNG{
  constructor(seed=1){ this.state=(Number(seed)>>>0)||1; }
  next(){
    let t=this.state+=0x6D2B79F5;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  }
}
function random(){ return ACTIVE_RNG ? ACTIVE_RNG.next() : nativeRandom(); }
const uid = (prefix="id") => `${prefix}_${Date.now().toString(36)}_${nativeRandom().toString(36).slice(2,8)}`;
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const randInt = (min,max) => Math.floor(random()*(max-min+1))+min;
const choice = arr => arr[Math.floor(random()*arr.length)];
const weighted = entries => {
  const total = entries.reduce((s,[,w])=>s+w,0); let r=random()*total;
  for (const [v,w] of entries) { r-=w; if (r<=0) return v; }
  return entries.at(-1)[0];
};
const deepClone = obj => JSON.parse(JSON.stringify(obj));

  defense:{jackRestriction:"classic",allowFreeBlitz:false,maxBlitzers:1,jackBoxDepth:5,jackMayBlitz:false,alignmentErrorRate:.006},
  kicking:{punting:false,reboundNets:true,dropKicks:true,puntMinDistance:18,kickoffOutOfBoundsSpot:20,deuce:{enabled:true,points:2},uno:{enabled:false,points:1},rouge:{enabled:true,points:1,trigger:"kick_dead_end_zone",possession:"receiving",spot:5},halo:true,haloViolationRate:.006},
  motion:{offensivePlayers:1,forwardMotionAllowed:true,secondMotionMan:false,eligiblePositions:["WR"],illegalExecutionRate:.006},
  clock:{stopOnIncomplete:true,stopOnOutOfBounds:true,stopOnChangeOfPossession:true,firstHalfFinalMinute:60,secondHalfFinalMinute:60,runningClock:true,timeoutsPerHalf:3,timeoutClockRunoff:[4,8],normalRunoff:[22,38],hurryRunoff:[10,20],bleedRunoff:[30,42],spikeRunoff:[2,4],kneelRunoff:[30,40],quarterBreakRecovery:7,halftimeRecovery:18},
  overtime:{enabled:true,possessionsEach:1,suddenDeathAfter:true,maxPeriods:3},
  penalties:{enabled:true,offensiveRate:.045,defensiveRate:.04,illegalMotionRate:.008,illegalDefenseRate:.008},

const TEAM_TEMPLATES = [
  ["Philadelphia Soul", "PHI"], ["Albany Firebirds", "ALB"],
  ["Orlando Predators", "ORL"], ["Arizona Rattlers", "ARI"],
  ["Chicago Rush", "CHI"], ["San Jose SaberCats", "SJS"],
  ["Tampa Bay Storm", "TBS"], ["Iowa Barnstormers", "IOW"]
];

const POSITIONS = ["QB","FB","WR","OL","DL","LB","DB","K"];
function slotCountsFor(playersPerSide=8){
  const n=clamp(Math.round(playersPerSide||8),4,12);
  const ol=n>=7?3:2,fb=n>=6?1:0,wr=Math.max(1,n-1-ol-fb);
  const dl=n>=7?3:2,lb=1,db=Math.max(1,n-dl-lb);
  return {offense:{QB:1,FB:fb,WR:wr,OL:ol},defense:{DL:dl,LB:lb,DB:db}};
}
function rosterTemplateForRules(inputRules){
  const r=normalizeRules(inputRules),o=r.personnel.offenseSlots,d=r.personnel.defenseSlots,positions=[];
  const add=(pos,n)=>{for(let i=0;i<n;i++)positions.push(pos);};
  add('QB',Math.max(1,o.QB||1));add('FB',Math.max(1,o.FB||0));add('WR',Math.max(2,(o.WR||1)+1));add('OL',Math.max(2,o.OL||2));
  add('DL',Math.max(2,d.DL||2));add('LB',Math.max(1,d.LB||1));add('DB',Math.max(2,(d.DB||2)+1));add('K',1);
  return positions;
}

const first=["Aaron","Aiden","Andre","Anthony","Brandon","Bryce","Caleb","Cam","Cameron","Carlos","Chris","Dante","Darius","Darren","DeAndre","Devin","Derek","Elijah","Eric","Isaiah","Jalen","Jamal","Jay","Jaylen","Jordan","Justin","Kendrick","Kevin","Malik","Marcus","Mason","Micah","Nate","Noah","Quentin","Rashad","Ryan","Sean","Tariq","Terrance","Tre","Trey","Ty","Victor","Xavier","Zay"];
const last=["Adams","Allen","Anderson","Baker","Bell","Brooks","Brown","Carter","Clark","Collins","Cooper","Davis","Edwards","Evans","Foster","Garcia","Gibson","Green","Hall","Harris","Hill","Jackson","James","Jenkins","Johnson","Jones","Kelly","King","Lewis","Martin","Miller","Mitchell","Moore","Murphy","Nelson","Parker","Reed","Robinson","Rodriguez","Scott","Smith","Stewart","Taylor","Thomas","Thompson","Turner","Walker","Ward","Washington","White","Williams","Wilson","Wright","Young"];
const hometowns=["Atlanta, GA","Baltimore, MD","Birmingham, AL","Charlotte, NC","Chicago, IL","Columbus, OH","Dallas, TX","Detroit, MI","Houston, TX","Jacksonville, FL","Las Vegas, NV","Los Angeles, CA","Memphis, TN","Miami, FL","Nashville, TN","New Orleans, LA","Orlando, FL","Philadelphia, PA","Phoenix, AZ","Pittsburgh, PA","San Antonio, TX","San Diego, CA","St. Louis, MO","Tampa, FL"];
function positionBody(position){
  const map={QB:[72,77,195,235],FB:[69,74,210,255],WR:[68,75,175,225],OL:[72,79,285,355],DL:[71,78,250,325],LB:[70,76,220,280],DB:[68,74,175,220],K:[68,75,165,215]};
  return map[position]||[69,76,180,250];
}
function fillPlayerBio(p){
  const seed=hashSeed(p.id||p.name||'player'),body=positionBody(p.position),span=(a,b,n)=>a+(n%(b-a+1));
  p.heightInches??=span(body[0],body[1],seed);
  p.weight??=span(body[2],body[3],seed>>>5);
  p.hometown??=hometowns[(seed>>>10)%hometowns.length];
  p.jerseyNumber??=((seed>>>16)%99)+1;
  return p;
}
function formatHeight(n){n=Number(n)||72;return `${Math.floor(n/12)}'${n%12}"`;}

const POSITION_RATING_WEIGHTS={
  QB:{passShort:1.6,passMedium:1.5,passDeep:1.1,armStrength:1.15,decision:1.45,awareness:1.15,scramble:.55},
  FB:{vision:1.1,power:1.15,breakTackle:1.1,ballSecurity:1.15,runBlock:.65,speed:.55,strength:.7},
  WR:{catching:1.35,routeRunning:1.3,release:1.05,speed:1.05,acceleration:.8,contestedCatch:.7,motion:.55},
  OL:{passBlock:1.4,runBlock:1.4,blockStrength:1.1,strength:1,awareness:.7,stamina:.55},
  DL:{passRush:1.3,blockShedding:1.25,strength:1,pursuit:.75,tackling:.7,awareness:.55},
  LB:{tackling:1.25,pursuit:1.1,zoneCoverage:.9,blockShedding:.8,strength:.7,awareness:.8,twoWay:.45},
  DB:{manCoverage:1.25,zoneCoverage:1.2,speed:1,acceleration:.8,awareness:.85,tackling:.65,wallAwareness:.5},
  K:{kickAccuracy:1.55,kickPower:1.25,kickoff:1,dropKick:.85,awareness:.35}
};
function calculateOverall(player){
  const weights=POSITION_RATING_WEIGHTS[player.position]||{awareness:1,speed:1,strength:1},r=player.ratings||{};
  let total=0,w=0;for(const [k,wt] of Object.entries(weights)){total+=(r[k]??r.overall??50)*wt;w+=wt;}
  return clamp(Math.round(total/Math.max(.01,w)),25,99);
}
function recalculateOverall(player){player.ratings.overall=calculateOverall(player);player.ratings.skill=Math.round(((player.ratings.awareness||50)+(player.ratings.speed||50)+(player.ratings.strength||50))/3);return player.ratings.overall;}
const PLAYER_ARCHETYPES={
  QB:['Pocket Passer','Mobile QB','Gunslinger'],FB:['Power Back','Two-Way Fullback','Space Back'],WR:['Speed Receiver','Possession Receiver','Motion Specialist'],OL:['Pass Protector','Road Grader','Two-Way Lineman'],DL:['Edge Rusher','Power Rusher','Run Anchor'],LB:['Coverage Jack','Mac Enforcer','Two-Way Backer'],DB:['Man Cover DB','Zone DB','Physical DB'],K:['Accuracy Kicker','Power Kicker','Drop-Kick Specialist']
};
function applyArchetype(position,ratings,archetype){
  const boost=(keys,n)=>keys.forEach(k=>ratings[k]=clamp((ratings[k]||50)+n,25,99));
  if(archetype==='Pocket Passer')boost(['passShort','passMedium','decision','awareness'],7);
  if(archetype==='Mobile QB')boost(['scramble','speed','acceleration','agility'],8);
  if(archetype==='Gunslinger')boost(['armStrength','passDeep'],9);
  if(archetype==='Power Back')boost(['power','breakTackle','strength','ballSecurity'],8);
  if(archetype==='Two-Way Fullback')boost(['twoWay','tackling','runBlock','strength'],8);
  if(archetype==='Space Back')boost(['speed','acceleration','agility','elusiveness'],8);
  if(archetype==='Speed Receiver')boost(['speed','acceleration','release'],9);
  if(archetype==='Possession Receiver')boost(['catching','routeRunning','contestedCatch'],8);
  if(archetype==='Motion Specialist')boost(['motion','release','acceleration','routeRunning'],8);
  if(archetype==='Pass Protector')boost(['passBlock','awareness'],10);
  if(archetype==='Road Grader')boost(['runBlock','blockStrength','strength'],9);
  if(archetype==='Two-Way Lineman')boost(['twoWay','passRush','blockShedding','runBlock'],7);
  if(archetype==='Edge Rusher')boost(['passRush','speed','pursuit'],9);
  if(archetype==='Power Rusher')boost(['passRush','strength','blockShedding'],8);
  if(archetype==='Run Anchor')boost(['tackling','blockShedding','strength'],8);
  if(archetype==='Coverage Jack')boost(['zoneCoverage','manCoverage','awareness','twoWay'],8);
  if(archetype==='Mac Enforcer')boost(['tackling','pursuit','strength','blockShedding'],8);
  if(archetype==='Two-Way Backer')boost(['twoWay','tackling','zoneCoverage','runBlock'],7);
  if(archetype==='Man Cover DB')boost(['manCoverage','speed','release'],8);
  if(archetype==='Zone DB')boost(['zoneCoverage','awareness','pursuit'],8);
  if(archetype==='Physical DB')boost(['tackling','strength','contestedCatch'],8);
  if(archetype==='Accuracy Kicker')boost(['kickAccuracy','dropKick'],10);
  if(archetype==='Power Kicker')boost(['kickPower','kickoff'],10);
  if(archetype==='Drop-Kick Specialist')boost(['dropKick','kickAccuracy'],12);
}
function playerDevelopmentKeys(position){
  return Object.keys(POSITION_RATING_WEIGHTS[position]||{}).filter(k=>k!=='overall');
}
function createPlayer(position,teamId){
  const age=randInt(21,33),base=randInt(42,78),r=(d=0)=>clamp(base+d+randInt(-9,9),25,99);
  const ratings={overall:base,speed:r(),acceleration:r(),agility:r(),strength:r(),stamina:r(4),durability:r(5),awareness:r(),
    passShort:r(),passMedium:r(),passDeep:r(),armStrength:r(),decision:r(),scramble:r(),catching:r(),routeRunning:r(),release:r(),contestedCatch:r(),ballSecurity:r(),
    vision:r(),elusiveness:r(),power:r(),breakTackle:r(),passBlock:r(),runBlock:r(),blockStrength:r(),manCoverage:r(),zoneCoverage:r(),tackling:r(),passRush:r(),blockShedding:r(),pursuit:r(),
    kickPower:r(),kickAccuracy:r(),kickoff:r(),dropKick:r(),twoWay:r(),wallAwareness:r(),motion:r()};
  if(position==='QB'){Object.assign(ratings,{passShort:r(12),passMedium:r(9),passDeep:r(6),armStrength:r(10),decision:r(10),scramble:r(3)});}
  if(position==='WR'){Object.assign(ratings,{catching:r(10),routeRunning:r(10),release:r(8),motion:r(8),speed:r(7)});}
  if(position==='FB'){Object.assign(ratings,{vision:r(8),power:r(10),breakTackle:r(8),ballSecurity:r(8)});}
  if(position==='OL'){Object.assign(ratings,{passBlock:r(12),runBlock:r(12),blockStrength:r(12),strength:r(10)});}
  if(position==='DL'){Object.assign(ratings,{passRush:r(12),blockShedding:r(11),strength:r(8)});}
  if(position==='LB'){Object.assign(ratings,{tackling:r(10),pursuit:r(8),zoneCoverage:r(5)});}
  if(position==='DB'){Object.assign(ratings,{manCoverage:r(11),zoneCoverage:r(10),tackling:r(5),speed:r(7)});}
  if(position==='K'){Object.assign(ratings,{kickPower:r(14),kickAccuracy:r(14),kickoff:r(12),dropKick:r(8)});}
  const archetype=choice(PLAYER_ARCHETYPES[position]||['Balanced']);applyArchetype(position,ratings,archetype);
  const player=fillPlayerBio({id:uid('p'),teamId,name:`${choice(first)} ${choice(last)}`,position,secondaryPositions:[],age,experience:Math.max(0,age-21),potential:clamp(base+randInt(6,24)-(age-21),35,95),archetype,ratings,fatigue:0,injuredGames:0,rosterStatus:'active',careerStatus:'active',stats:emptyStats(),seasonStats:emptyStats(),history:[],awards:[]});
  recalculateOverall(player);return player;
}
function emptyStats(){return {gp:0,offSnaps:0,defSnaps:0,stSnaps:0,passAtt:0,passCmp:0,passYds:0,passTD:0,int:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,recYds:0,recTD:0,tackles:0,sacks:0,defInt:0,defTD:0,intRet:0,intRetYds:0,ff:0,fr:0,fumRet:0,fumRetYds:0,kr:0,krYds:0,krTD:0,pr:0,prYds:0,prTD:0,fgm:0,fga:0,xpm:0,xpa:0};}
function generateRoster(teamId,rules=DEFAULT_RULES){return rosterTemplateForRules(rules).map(pos=>createPlayer(pos,teamId));}
function developPlayer(p){
  p.age=(p.age||21)+1;p.experience=(p.experience||0)+1;
  const pot=p.potential??p.ratings?.overall??55,ovr=p.ratings?.overall??55;
  const age=p.age,upside=clamp((pot-ovr)/18,-1.5,2.5);
  let ageTrend=age<=23?1.7:age<=26?1.05:age<=29?.25:age<=32?-.75:-1.7;
  const keys=new Set([...playerDevelopmentKeys(p.position),'speed','acceleration','agility','strength','stamina','durability','awareness','twoWay','wallAwareness','motion']);
  for(const key of keys){
    if(key==='overall'||key==='skill'||p.ratings[key]===undefined)continue;
    const physical=['speed','acceleration','agility','stamina'].includes(key),veteranPenalty=physical&&age>=30?-0.8:0;
    const change=Math.round(ageTrend+upside+veteranPenalty+(random()*3.4-1.7));
    p.ratings[key]=clamp(p.ratings[key]+change,25,99);
  }
  p.potential=clamp(Math.round(pot+(age<=24?randInt(-1,2):randInt(-2,0))),30,99);
  p.fatigue=0;p.injuredGames=Math.max(0,(p.injuredGames||0)-1);recalculateOverall(p);return p;
}
function developRoster(players){for(const p of players)developPlayer(p);}
function retirementProbability(p){
  const age=p.age||25,ovr=p.ratings?.overall||50,inj=(p.injuredGames||0)>0?0.02:0;
  if(age<29)return .002+inj;if(age<32)return .015+Math.max(0,52-ovr)/800+inj;if(age<35)return .08+Math.max(0,60-ovr)/350+inj;if(age<38)return .28+Math.max(0,65-ovr)/220+inj;return .68+inj;
}
function shouldRetire(p){return random()<clamp(retirementProbability(p),0,.94);}
function transaction(league,type,player,{fromTeamId=null,toTeamId=null,details=''}={}){
  league.transactions??=[];const tx={id:uid('tx'),season:league.season,phase:league.phase,type,playerId:player.id,playerName:player.name,fromTeamId,toTeamId,details};league.transactions.push(tx);return tx;
}
function addFreeAgent(league,p,details='Entered free agency'){
  league.freeAgents??=[];p.teamId=null;p.rosterStatus='freeAgent';p.careerStatus='active';if(!league.freeAgents.some(x=>x.id===p.id))league.freeAgents.push(p);transaction(league,'free_agent',p,{details});return p;
}
function retirePlayer(league,p,fromTeamId=null){
  league.retiredPlayers??=[];p.teamId=null;p.rosterStatus='retired';p.careerStatus='retired';p.retiredSeason=league.season;league.retiredPlayers.push(p);transaction(league,'retirement',p,{fromTeamId,details:`Retired at age ${p.age}`});
}
function signPlayer(league,team,p,details='CPU signing'){
  league.freeAgents??=[];league.freeAgents=league.freeAgents.filter(x=>x.id!==p.id);p.teamId=team.id;p.rosterStatus='active';p.careerStatus='active';team.roster.push(p);transaction(league,'signing',p,{toTeamId:team.id,details});team.depthChart=null;return p;
}
function releasePlayer(league,team,p,details='Released'){
  team.roster=team.roster.filter(x=>x.id!==p.id);team.depthChart=null;p.teamId=null;p.rosterStatus='freeAgent';league.freeAgents??=[];league.freeAgents.push(p);transaction(league,'release',p,{fromTeamId:team.id,details});return p;
}
function rosterNeeds(team,rules){
  const required=rosterTemplateForRules(rules),counts={};for(const p of team.roster)counts[p.position]=(counts[p.position]||0)+1;
  const want={};for(const pos of required)want[pos]=(want[pos]||0)+1;return Object.entries(want).flatMap(([pos,n])=>Array(Math.max(0,n-(counts[pos]||0))).fill(pos));
}
function bestFreeAgentFor(league,pos){return [...(league.freeAgents||[])].filter(p=>p.position===pos&&p.careerStatus!=='retired').sort((a,b)=>(b.ratings?.overall||0)-(a.ratings?.overall||0))[0]||null;}
function repairTeamRoster(league,team){
  for(const pos of rosterNeeds(team,league.rules)){
    let p=bestFreeAgentFor(league,pos);if(!p){p=createPlayer(pos,null);p.age=randInt(21,27);p.experience=Math.max(0,p.age-21);p.rosterStatus='freeAgent';p.teamId=null;league.freeAgents??=[];league.freeAgents.push(p);}
    signPlayer(league,team,p,'Roster repair signing');
  }
  ensureDepthChart(team,league.rules);return validateLineup(team,starters(team,league.rules),league.rules);
}
function seedFreeAgents(league,count=Math.max(10,league.teams.length*3)){
  league.freeAgents??=[];const template=rosterTemplateForRules(league.rules);
  while(league.freeAgents.length<count){const p=createPlayer(choice(template),null);p.teamId=null;p.rosterStatus='freeAgent';league.freeAgents.push(p);}return league.freeAgents;
}
function cpuRosterImprove(league,team,maxMoves=2){
  let moves=0;const positions=[...new Set(team.roster.map(p=>p.position))];
  while(moves<maxMoves){
    let bestMove=null;
    for(const pos of positions){
      const current=team.roster.filter(p=>p.position===pos).sort((a,b)=>(a.ratings?.overall||0)-(b.ratings?.overall||0))[0],fa=bestFreeAgentFor(league,pos);
      if(!current||!fa)continue;const gain=(fa.ratings?.overall||0)-(current.ratings?.overall||0);
      if(gain>=5&&(!bestMove||gain>bestMove.gain))bestMove={current,fa,gain};
    }
    if(!bestMove)break;releasePlayer(league,team,bestMove.current,`CPU roster upgrade (${bestMove.gain} OVR gain)`);signPlayer(league,team,bestMove.fa,'CPU roster upgrade signing');moves++;
  }
  return moves;
}
function processOffseasonPlayerWorld(league){
  league.freeAgents??=[];league.retiredPlayers??=[];league.transactions??=[];
  for(const team of league.teams){
    const staying=[];

let storageAvailable=false;
function getStorage(){
  try {
    const test='__afgm_test__';
    window.localStorage.setItem(test,'1');

    return window.localStorage;

    storageAvailable=false;

  return false;
}

  try { const raw=store.getItem(KEY); return raw?migrateUniverse(JSON.parse(raw)):null; } catch(e){ return null; }
}

function perNum(a,b){return b?(a/b):0;}
function relevantRatings(p){
  const groups={
    QB:['overall','passShort','passMedium','passDeep','armStrength','decision','scramble','awareness','stamina'],
    WR:['overall','speed','acceleration','catching','routeRunning','release','contestedCatch','ballSecurity','motion','wallAwareness'],
    FB:['overall','speed','strength','vision','power','elusiveness','breakTackle','ballSecurity','runBlock','twoWay'],
    OL:['overall','strength','passBlock','runBlock','blockStrength','stamina','twoWay'],
    DL:['overall','strength','passRush','blockShedding','pursuit','tackling','stamina','twoWay'],
    LB:['overall','speed','tackling','pursuit','zoneCoverage','manCoverage','passRush','twoWay'],
    DB:['overall','speed','acceleration','manCoverage','zoneCoverage','tackling','pursuit','wallAwareness','twoWay'],
    K:['overall','kickPower','kickAccuracy','kickoff','dropKick','stamina']

  return groups[p.position]||['overall','speed','strength','awareness','stamina'];
}
function statTableForPlayer(p,s,label){

  if(['QB','FB','WR'].includes(p.position)||s.rushAtt)rows+=`<tr><td>Rushing</td><td>${s.rushAtt||0} ATT · ${s.rushYds||0} YDS · ${s.rushTD||0} TD · ${per(s.rushYds||0,s.rushAtt||0)} Y/A</td></tr>`;
  if(['WR','FB'].includes(p.position)||s.rec)rows+=`<tr><td>Receiving</td><td>${s.rec||0} REC · ${s.recYds||0} YDS · ${s.recTD||0} TD · ${per(s.recYds||0,s.rec||0)} Y/R</td></tr>`;

  if(p.position==='K'||s.fga||s.xpa)rows+=`<tr><td>Kicking</td><td>${s.fgm||0}/${s.fga||0} FG · ${s.xpm||0}/${s.xpa||0} XP</td></tr>`;

  return `<div class="card"><h3>${h(label)}</h3><div class="scroll"><table>${common}${rows}</table></div></div>`;
}

  <div class="card"><h3>Free Agents (${fa.length})</h3><div class="scroll"><table><thead><tr><th>Pos</th><th>Player</th><th>Age</th><th>OVR</th><th>POT</th><th>Archetype</th></tr></thead><tbody>${fa.slice(0,60).map(p=>`<tr><td>${p.position}</td><td>${playerButton(p)}</td><td>${p.age}</td><td><strong>${p.ratings.overall}</strong></td><td>${p.potential??'—'}</td><td>${h(p.archetype||'Balanced')}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid"><div class="card"><h3>Recent Transactions</h3>${tx.length?tx.map(x=>`<p><strong>${x.season}</strong> · ${h(x.type.replace(/_/g,' '))} · ${h(x.playerName)} ${x.fromTeamId?teamAbbr(x.fromTeamId)+' → ':''}${x.toTeamId?teamAbbr(x.toTeamId):''}<br><span class="muted small">${h(x.details||'')}</span></p>`).join(''):'<p class="muted">No transactions yet.</p>'}</div>
  <div class="card"><h3>Retired Players</h3>${ret.length?ret.map(p=>`<p>${playerButton(p)} · ${p.position} · retired ${p.retiredSeason||'—'} · ${p.stats?.gp||0} GP</p>`).join(''):'<p class="muted">No retirements yet.</p>'}</div></div>`;wirePlayerLinks();
}
function renderHistory(){
  const l=league(),currentRecords=ensureLeagueRecords(l),teamName=id=>l.teams.find(t=>t.id===id)?.name||'Unknown Team';
  const recName={teamPoints:'Team Points',passingYards:'Passing Yards',passingTD:'Passing TD',rushingYards:'Rushing Yards',rushingTD:'Rushing TD',receivingYards:'Receiving Yards',receivingTD:'Receiving TD',tackles:'Tackles',sacks:'Sacks',defInterceptions:'Defensive INT',fieldGoals:'Field Goals',returnYards:'Return Yards',teamWins:'Team Wins',teamPoints:'Team Points',kickReturnYards:'Kick Return Yards'};
  const recordRows=(obj,type)=>Object.entries(obj||{}).filter(([,r])=>r&&Number.isFinite(r.value)).map(([k,r])=>{const ps=r.playerId?findPlayerSnapshot(l,r.playerId):null;const who=ps?`${ps.name} (${ps.teamAbbr||'—'})`:r.teamId?teamName(r.teamId):'—';return `<tr><td>${h(recName[k]||k)}</td><td><strong>${r.value}</strong></td><td>${h(who)}</td><td>${r.season||'—'}</td></tr>`}).join('');
  const seasons=[...(l.completedSeasons||[])].reverse();
  app.innerHTML=`<div class="card"><h2>League History</h2><p class="muted">Champions, awards, records, standings, and statistical leaders are preserved by season.</p></div>
  <div class="grid"><div class="card"><h3>Single-Game Records</h3><div class="scroll"><table><thead><tr><th>Record</th><th>Value</th><th>Holder</th><th>Season</th></tr></thead><tbody>${recordRows(currentRecords.game,'game')||'<tr><td colspan="4">No records yet.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>Single-Season Records</h3><div class="scroll"><table><thead><tr><th>Record</th><th>Value</th><th>Holder</th><th>Season</th></tr></thead><tbody>${recordRows(currentRecords.season,'season')||'<tr><td colspan="4">No completed-season records yet.</td></tr>'}</tbody></table></div></div><div class="card"><h3>Career Records</h3><div class="scroll"><table><thead><tr><th>Record</th><th>Value</th><th>Holder</th><th>Through</th></tr></thead><tbody>${recordRows(currentRecords.career,'career')||'<tr><td colspan="4">Career records begin after the first completed season.</td></tr>'}</tbody></table></div></div></div>
  ${seasons.length?seasons.map(y=>{const champ=(y.teamSeasons||[]).find(t=>t.teamId===y.championTeamId),leaders=(y.playerSeasons||[]),top=(key)=>[...leaders].sort((a,b)=>(b.stats?.[key]||0)-(a.stats?.[key]||0))[0];const lp=top('passYds'),lr=top('rushYds'),lrec=top('recYds');return `<div class="card"><h3>${y.season} Season</h3><p><strong>Champion:</strong> ${h(champ?.name||'—')}</p>${(y.awards||[]).length?`<p><strong>Awards:</strong> ${(y.awards||[]).map(a=>`${h(a.type)} — ${h(a.name)} (${h((y.teamSeasons||[]).find(t=>t.teamId===a.teamId)?.abbr||'—')})`).join(' · ')}</p>`:''}<p><strong>Leaders:</strong> Passing ${h(lp?.name||'—')} ${lp?.stats?.passYds||0} · Rushing ${h(lr?.name||'—')} ${lr?.stats?.rushYds||0} · Receiving ${h(lrec?.name||'—')} ${lrec?.stats?.recYds||0}</p><div class="scroll"><table><thead><tr><th>Rank</th><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th></tr></thead><tbody>${(y.standings||[]).map(r=>`<tr><td>${r.rank}</td><td>${h(r.name||((y.teamSeasons||[]).find(t=>t.teamId===r.teamId)?.name)||'—')}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td>${r.pf}</td><td>${r.pa}</td></tr>`).join('')}</tbody></table></div></div>`}).join(''):'<div class="card"><p class="muted">Complete a season to begin league history.</p></div>'}`;
}
function renderSchedule(){
  const l=league();app.innerHTML=`<div class="card"><h2>${l.season} Schedule</h2><table><tbody>${l.schedule.map(g=>{const H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId),label=g.stage==='playoff'?(g.playoffLabel||'Playoff'):`Week ${g.week}`;return `<tr><td>${h(label)}</td><td>${h(A.abbr)} @ ${h(H.abbr)}</td><td>${g.played?`${g.awayScore}-${g.homeScore}`:`<button class="sim" data-id="${g.id}">Sim</button>`}</td><td>${g.played?`<button class="box" data-id="${g.id}">View</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`;
  document.querySelectorAll('.sim').forEach(b=>b.onclick=()=>simGame(l.schedule.find(g=>g.id===b.dataset.id)));
  document.querySelectorAll('.box').forEach(b=>b.onclick=()=>{selectedGameId=b.dataset.id;view='game';render();});
}
function renderTeam(){
  const l=league(),t=l.teams.find(x=>x.id===selectedTeamId)||l.teams[0];selectedTeamId=t.id;
  const sorted=[...t.roster].sort((a,b)=>a.position.localeCompare(b.position)||b.ratings.overall-a.ratings.overall),chart=ensureDepthChart(t,l.rules),byId=new Map(t.roster.map(p=>[p.id,p]));
  const leaders={pass:[...t.roster].sort((a,b)=>(b.seasonStats?.passYds||0)-(a.seasonStats?.passYds||0))[0],rush:[...t.roster].sort((a,b)=>(b.seasonStats?.rushYds||0)-(a.seasonStats?.rushYds||0))[0],rec:[...t.roster].sort((a,b)=>(b.seasonStats?.recYds||0)-(a.seasonStats?.recYds||0))[0],def:[...t.roster].sort((a,b)=>((b.seasonStats?.tackles||0)+(b.seasonStats?.sacks||0)*5+(b.seasonStats?.defInt||0)*8)-((a.seasonStats?.tackles||0)+(a.seasonStats?.sacks||0)*5+(a.seasonStats?.defInt||0)*8))[0]};
  const ts=teamSeasonStats(l,t.id),championships=(t.history||[]).filter(y=>y.champion).length;
  const names=ids=>(ids||[]).map(id=>byId.get(id)).filter(Boolean).map(playerButton).join(', ')||'—';
  app.innerHTML=`<div class="card"><h2>${h(t.name)}</h2><p>${t.wins}-${t.losses}-${t.ties} · PF ${t.pf} · PA ${t.pa} · ${championships} championship${championships===1?'':'s'}</p><div class="statline"><span><strong>${perNum(ts.points,ts.gp).toFixed(1)}</strong><br><span class="muted small">PPG</span></span><span><strong>${perNum(ts.totalYds,ts.gp).toFixed(1)}</strong><br><span class="muted small">YPG</span></span><span><strong>${ts.takeaways-ts.turnovers>=0?'+':''}${ts.takeaways-ts.turnovers}</strong><br><span class="muted small">TO Diff</span></span></div></div>
  <div class="grid">
    <div class="card"><h3>Team Leaders</h3><p>Passing: ${leaders.pass?playerButton(leaders.pass):'—'} · ${leaders.pass?.seasonStats?.passYds||0} YDS</p><p>Rushing: ${leaders.rush?playerButton(leaders.rush):'—'} · ${leaders.rush?.seasonStats?.rushYds||0} YDS</p><p>Receiving: ${leaders.rec?playerButton(leaders.rec):'—'} · ${leaders.rec?.seasonStats?.recYds||0} YDS</p><p>Defense: ${leaders.def?playerButton(leaders.def):'—'} · ${leaders.def?.seasonStats?.tackles||0} TKL</p></div>
    <div class="card"><h3>Depth Chart</h3><p><strong>QB:</strong> ${names([chart.offense.QB])}</p><p><strong>FB:</strong> ${names([chart.offense.FB])}</p><p><strong>WR:</strong> ${names(chart.offense.WR)}</p><p><strong>OL:</strong> ${names(chart.offense.OL)}</p><p><strong>DL:</strong> ${names(chart.defense.DL)}</p><p><strong>LB:</strong> ${names([chart.defense.LB])}</p><p><strong>DB:</strong> ${names(chart.defense.DB)}</p></div>
  </div>
  <div class="card"><h3>Roster</h3><p class="muted">Tap a player to open their profile and full statistics.</p><div class="scroll"><table><thead><tr><th>#</th><th>Pos</th><th>Player</th><th>Age</th><th>OVR</th><th>POT</th><th>Archetype</th><th>Snaps O/D</th><th>Fatigue</th><th>Status</th><th>${l.season} production</th></tr></thead><tbody>${sorted.map(p=>`<tr><td>${p.jerseyNumber}</td><td>${p.position}</td><td>${playerButton(p)}</td><td>${p.age}</td><td><strong>${p.ratings.overall}</strong></td><td>${p.potential??'—'}</td><td>${h(p.archetype||'Balanced')}</td><td>${p.seasonStats?.offSnaps||0}/${p.seasonStats?.defSnaps||0}</td><td>${Math.round(p.fatigue||0)}</td><td>${p.injuredGames?`INJ ${p.injuredGames}`:'Active'}</td><td>${h(playerSeasonSummary(p))}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><h3>Franchise History</h3>${(t.history||[]).length?`<div class="scroll"><table><thead><tr><th>Season</th><th>Record</th><th>PF</th><th>PA</th><th>Result</th></tr></thead><tbody>${[...t.history].reverse().map(y=>`<tr><td>${y.season}</td><td>${y.w}-${y.l}-${y.t}</td><td>${y.pf}</td><td>${y.pa}</td><td>${y.champion?'Champion':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Franchise history begins after a completed season.</p>'}</div>`;
  wirePlayerLinks();
}
function renderGame(){
  const l=league(),g=l.schedule.find(x=>x.id===selectedGameId)||l.schedule.find(x=>x.played);
  if(!g){app.innerHTML='<div class="card">No completed game yet.</div>';return;}
  const H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId),B=g.boxScore||{};
  app.innerHTML=`<div class="card"><h2>${h(A.name)} @ ${h(H.name)}</h2><div class="score">${A.abbr} ${g.awayScore} — ${H.abbr} ${g.homeScore}</div><p class="muted">Simulation engine ${g.engineVersion||'legacy'} · ${(g.drives||[]).length} drives · player and team stats derived from the event log</p></div>
  <div class="card"><h3>Team stats</h3><div class="scroll"><table><tr><th></th><th>${A.abbr}</th><th>${H.abbr}</th></tr>
  <tr><td>First downs</td><td>${B.away?.firstDowns??'-'}</td><td>${B.home?.firstDowns??'-'}</td></tr>
  <tr><td>Total yards</td><td>${B.away?.totalYds??'-'}</td><td>${B.home?.totalYds??'-'}</td></tr>
  <tr><td>Rush</td><td>${B.away?.rushAtt??'-'}-${B.away?.rushYds??'-'}</td><td>${B.home?.rushAtt??'-'}-${B.home?.rushYds??'-'}</td></tr>
  <tr><td>Passing</td><td>${B.away?.completions??'-'}/${B.away?.passAtt??'-'}-${B.away?.passYds??'-'}</td><td>${B.home?.completions??'-'}/${B.home?.passAtt??'-'}-${B.home?.passYds??'-'}</td></tr>
  <tr><td>Turnovers</td><td>${B.away?.turnovers??'-'}</td><td>${B.home?.turnovers??'-'}</td></tr>
  <tr><td>Sacks allowed</td><td>${B.away?.sacksAllowed??'-'}</td><td>${B.home?.sacksAllowed??'-'}</td></tr>
  <tr><td>Penalties</td><td>${B.away?.penalties??'-'}-${B.away?.penaltyYds??'-'}</td><td>${B.home?.penalties??'-'}-${B.home?.penaltyYds??'-'}</td></tr>
  <tr><td>Return yards</td><td>${(B.away?.kickReturnYds||0)+(B.away?.puntReturnYds||0)}</td><td>${(B.home?.kickReturnYds||0)+(B.home?.puntReturnYds||0)}</td></tr></table></div></div>
  <div class="grid">${gameStatSections(A,g)}${gameStatSections(H,g)}</div>
  <div class="card"><h3>Play-by-play</h3><div class="log">${(g.events||[]).map(e=>h(eventText(e))).join('<br>')}</div></div>`;
  wirePlayerLinks();
}
function renderUniverse(){ app.innerHTML=`<div class="card"><h2>Universe</h2><p>${h(universe.name)}</p><label>Active league <select id="leagueSelect">${universe.leagues.map(l=>`<option value="${l.id}" ${l.id===universe.activeLeagueId?'selected':''}>${h(l.name)} (${l.season})</option>`).join('')}</select></label></div><div class="card"><h3>Save & League Tools</h3><div class="actions"><button id="addLeague">Add League</button><button id="saveNow">Save Now</button><button id="exportSave">Export Save</button><button id="importSave">Import Save</button><button id="reset">Reset Universe</button></div><p class="muted">${storageAvailable?'This browser allows automatic local saves.':'iOS local-file mode blocks automatic browser storage here. The game still works for this session; use Export Save before closing and Import Save when you return.'}</p><textarea id="saveBox" style="width:100%;min-height:120px;margin-top:10px;background:#0d1525;color:#f3f4f6;border:1px solid #3b4a66;border-radius:8px;padding:10px;box-sizing:border-box" placeholder="Exported save data appears here. Paste save data here to import."></textarea></div>`;
 document.querySelector('#leagueSelect').onchange=e=>{universe.activeLeagueId=e.target.value;persist();render();};
 document.querySelector('#addLeague').onclick=()=>{createLeague(universe,{name:`Arena League ${universe.leagues.length+1}`,teamCount:4});persist();render();};
 document.querySelector('#saveNow').onclick=()=>persist();
 document.querySelector('#exportSave').onclick=()=>{const box=document.querySelector('#saveBox');box.value=exportSave();box.focus();box.select();saveStatus.textContent='Save exported';};
 document.querySelector('#importSave').onclick=()=>{const box=document.querySelector('#saveBox');try{importSave(box.value);saveStatus.textContent='Save imported';}catch(e){alert(e.message);}};
 document.querySelector('#reset').onclick=()=>{if(confirm('Delete this universe?')){clearSave();universe=createUniverse();createLeague(universe,{name:'Arena Football League',teamCount:4});persist();render();}};
}
function simGame(g,rerender=true){ if(!g||g.played)return; const l=league(),H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId); const res=simulateGame(H,A,l.rules,{seed:g.seed}); recordResult(l,g,res); selectedGameId=g.id; persist(); if(rerender){view='game';render();} }
window.AFGM_DEV={runSimulationSelfTests,runLeagueLifecycleSelfTest,runRulesVariantSelfTest,runCareerWorldSelfTest,validateSchedule,simulateGame,normalizeRules,DEFAULT_RULES};
saveStatus.textContent=storageAvailable?'Ready · auto-save on':'Ready · session save';
render();
</script>
