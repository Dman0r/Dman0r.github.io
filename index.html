<style>

<body>
<header>
  <h1>Arena Football GM</h1>
  <span id="saveStatus">Starting…</span>
</header>
<nav id="tabs"></nav>
<main id="app"></main>
<script>
const nativeRandom = Math.random.bind(Math);
let ACTIVE_RNG = null;
function hashSeed(value){
  let h=2166136261>>>0;
  for(const ch of String(value)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); }
  return h>>>0 || 1;
}
class SeededRNG{
  constructor(seed=1){ this.state=(Number(seed)>>>0)||1; }
  next(){
    let t=this.state+=0x6D2B79F5;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  }
}
function random(){ return ACTIVE_RNG ? ACTIVE_RNG.next() : nativeRandom(); }
const uid = (prefix="id") => `${prefix}_${Date.now().toString(36)}_${nativeRandom().toString(36).slice(2,8)}`;
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const randInt = (min,max) => Math.floor(random()*(max-min+1))+min;
const choice = arr => arr[Math.floor(random()*arr.length)];
const weighted = entries => {
  const total = entries.reduce((s,[,w])=>s+w,0); let r=random()*total;
  for (const [v,w] of entries) { r-=w; if (r<=0) return v; }
  return entries.at(-1)[0];
};
const deepClone = obj => JSON.parse(JSON.stringify(obj));
const DEFAULT_RULES = {
  name:"Arena Football GM Base",
  fieldLength:50, fieldWidth:28, endZoneLength:8, downs:4, firstDownDistance:10, quarterMinutes:15, playersOnField:8,
  wallsInPlay:true, reboundNets:true, highMotion:true, secondMotionMan:false, ironman:true, punting:false,
  dropKicks:true, fourPointDropFieldGoal:true, deuce:true, uno:false, rouge:true, halo:true, jackRestrictions:"classic", runningClock:true,
  kickoffSpot:0, touchbackSpot:5, kickoffOutOfBoundsSpot:20,
  field:{length:50,width:28,endZoneDepth:8,walls:"live"},
  personnel:{playersPerSide:8,ironman:true,substitutionMode:"ironman",specialistExemptions:["QB","K"],motionPlayers:1,highMotion:true},
  defense:{jackRestriction:"classic",allowFreeBlitz:false},
  kicking:{punting:false,reboundNets:true,dropKicks:true,deuce:{enabled:true,points:2},uno:{enabled:false,points:1},rouge:{enabled:true,points:1},halo:true},
  motion:{offensivePlayers:1,forwardMotionAllowed:true,secondMotionMan:false},
  clock:{stopOnIncomplete:true,stopOnOutOfBounds:true,firstHalfFinalMinute:60,secondHalfFinalMinute:60,runningClock:true,timeoutsPerHalf:3,timeoutClockRunoff:[4,8],normalRunoff:[22,38],hurryRunoff:[10,20],bleedRunoff:[30,42]},
  overtime:{enabled:true,possessionsEach:1,suddenDeathAfter:true,maxPeriods:3},
  penalties:{enabled:true,offensiveRate:.045,defensiveRate:.04,illegalMotionRate:.008,illegalDefenseRate:.008},
  injuries:{enabled:true,perSnapRate:.0015},
  scoring:{td:6,xp1:1,xp2:2,fg:3,safety:2,dropFg:4,dropPat:2}
};

const TEAM_TEMPLATES = [
  ["Philadelphia Soul", "PHI"], ["Albany Firebirds", "ALB"],
  ["Orlando Predators", "ORL"], ["Arizona Rattlers", "ARI"],
  ["Chicago Rush", "CHI"], ["San Jose SaberCats", "SJS"],
  ["Tampa Bay Storm", "TBS"], ["Iowa Barnstormers", "IOW"]
];

const POSITIONS = ["QB","FB","WR","WR","OL","OL","OL","DL","DL","LB","DB","DB","DB","K"];

const first=["Jay","Marcus","Derek","Chris","Andre","Ty","Malik","Jordan","Dante","Cam","Devin","Trey","Nate","Isaiah"];
const last=["Johnson","Williams","Davis","Brown","Miller","Wilson","Moore","Taylor","Anderson","Thomas","Jackson","White","Harris","Martin"];

function createPlayer(position,teamId){
  const age=randInt(21,33),base=randInt(42,78),r=(d=0)=>clamp(base+d+randInt(-9,9),25,99);
  const ratings={overall:base,speed:r(),acceleration:r(),agility:r(),strength:r(),stamina:r(4),durability:r(5),awareness:r(),
    passShort:r(),passMedium:r(),passDeep:r(),armStrength:r(),decision:r(),scramble:r(),catching:r(),routeRunning:r(),release:r(),contestedCatch:r(),ballSecurity:r(),
    vision:r(),elusiveness:r(),power:r(),breakTackle:r(),passBlock:r(),runBlock:r(),blockStrength:r(),manCoverage:r(),zoneCoverage:r(),tackling:r(),passRush:r(),blockShedding:r(),pursuit:r(),
    kickPower:r(),kickAccuracy:r(),kickoff:r(),dropKick:r(),twoWay:r(),wallAwareness:r(),motion:r()};
  if(position==='QB'){Object.assign(ratings,{passShort:r(12),passMedium:r(9),passDeep:r(6),armStrength:r(10),decision:r(10),scramble:r(3)});}
  if(position==='WR'){Object.assign(ratings,{catching:r(10),routeRunning:r(10),release:r(8),motion:r(8),speed:r(7)});}
  if(position==='FB'){Object.assign(ratings,{vision:r(8),power:r(10),breakTackle:r(8),ballSecurity:r(8)});}
  if(position==='OL'){Object.assign(ratings,{passBlock:r(12),runBlock:r(12),blockStrength:r(12),strength:r(10)});}
  if(position==='DL'){Object.assign(ratings,{passRush:r(12),blockShedding:r(11),strength:r(8)});}
  if(position==='LB'){Object.assign(ratings,{tackling:r(10),pursuit:r(8),zoneCoverage:r(5)});}
  if(position==='DB'){Object.assign(ratings,{manCoverage:r(11),zoneCoverage:r(10),tackling:r(5),speed:r(7)});}
  if(position==='K'){Object.assign(ratings,{kickPower:r(14),kickAccuracy:r(14),kickoff:r(12),dropKick:r(8)});}
  ratings.skill=Math.round((ratings.awareness+ratings.speed+ratings.strength)/3);
  return {id:uid('p'),teamId,name:`${choice(first)} ${choice(last)}`,position,secondaryPositions:[],age,experience:Math.max(0,age-21),ratings,fatigue:0,injuredGames:0,rosterStatus:'active',stats:emptyStats()};
}
function emptyStats(){return {gp:0,passAtt:0,passCmp:0,passYds:0,passTD:0,int:0,rushAtt:0,rushYds:0,rushTD:0,rec:0,recYds:0,recTD:0,tackles:0,sacks:0,defInt:0,defTD:0,intRet:0,intRetYds:0,ff:0,fr:0,fumRet:0,fumRetYds:0,kr:0,krYds:0,krTD:0,fgm:0,fga:0,xpm:0,xpa:0};}
function generateRoster(teamId){return POSITIONS.map(pos=>createPlayer(pos,teamId));}
function developRoster(players){
  for(const p of players){
    p.age++;
    const delta=p.age<=25?randInt(-1,4):p.age<=29?randInt(-2,2):randInt(-4,1);
    for(const key of Object.keys(p.ratings)) p.ratings[key]=clamp(p.ratings[key]+delta,25,99);
    p.fatigue=0; p.injuredGames=Math.max(0,p.injuredGames-1);
  }
}
function depthChart(roster){
  const byPos={};
  for(const p of roster){ (byPos[p.position]??=[]).push(p); }
  for(const list of Object.values(byPos)) list.sort((a,b)=>b.ratings.overall-a.ratings.overall);
  return byPos;
}

function createUniverse(name='Arena Universe'){
  return { id:uid('u'), name, createdAt:new Date().toISOString(), activeLeagueId:null, leagues:[], history:[], version:SAVE_SCHEMA_VERSION };
}
function createLeague(universe,{name='Arena League',teamCount=4,rules=DEFAULT_RULES}={}){
  const league={ id:uid('lg'), name, season:2026, rules:deepClone(rules), teams:[], schedule:[], completedSeasons:[] };
  for(let i=0;i<teamCount;i++){
    const [name,abbr]=TEAM_TEMPLATES[i%TEAM_TEMPLATES.length]; const id=uid('t');
    league.teams.push({ id,name,abbr,roster:generateRoster(id), wins:0,losses:0,ties:0,pf:0,pa:0, gamesPlayed:0 });
  }
  league.schedule=generateSchedule(league.teams,league.season);
  universe.leagues.push(league); universe.activeLeagueId ??= league.id;
  return league;
}
function generateSchedule(teams,season){
  const games=[]; let week=1;
  for(let round=0;round<2;round++){
    for(let i=0;i<teams.length;i++) for(let j=i+1;j<teams.length;j++){
      const home=round===0?teams[i]:teams[j], away=round===0?teams[j]:teams[i];
      const gameId=uid('g');
      games.push({id:gameId,seed:hashSeed(`${season}:${gameId}:${home.id}:${away.id}`),season,week:week++,homeId:home.id,awayId:away.id,played:false,homeScore:null,awayScore:null,boxScore:null,gameStats:null,events:null,eventLog:null,drives:null,engineVersion:null});
    }
  }
  return games;
}
function standings(league){
  return [...league.teams].sort((a,b)=>(b.wins-b.losses)-(a.wins-a.losses)|| (b.pf-b.pa)-(a.pf-a.pa));
}
function recordResult(league,game,result){
  if(game.played) return;
  game.played=true; game.homeScore=result.homeScore; game.awayScore=result.awayScore; game.boxScore=result.boxScore;
  game.events=result.events; game.eventLog=result.eventLog||null; game.drives=result.drives||null; game.gameStats=result.gameStats||null; game.engineVersion=result.engineVersion||null; game.seed=result.seed??game.seed;
  const h=league.teams.find(t=>t.id===game.homeId), a=league.teams.find(t=>t.id===game.awayId);
  h.gamesPlayed++; a.gamesPlayed++; h.pf+=result.homeScore; h.pa+=result.awayScore; a.pf+=result.awayScore; a.pa+=result.homeScore;
  if(result.homeScore>result.awayScore){h.wins++;a.losses++;} else if(result.awayScore>result.homeScore){a.wins++;h.losses++;} else {h.ties++;a.ties++;}
}
function advanceSeason(league){
  if(league.schedule.some(g=>!g.played))throw new Error('Finish all games first.');
  const table=standings(league),champion=table[0]||null;league.completedSeasons.push({season:league.season,championTeamId:champion?.id||null,rules:deepClone(normalizeRules(league.rules)),standings:table.map(t=>({teamId:t.id,w:t.wins,l:t.losses,t:t.ties,pf:t.pf,pa:t.pa})),games:league.schedule.map(g=>deepClone(g)),teamSnapshots:league.teams.map(t=>({id:t.id,name:t.name,abbr:t.abbr,rosterIds:t.roster.map(p=>p.id)}))});
  league.season++;for(const t of league.teams){developRoster(t.roster);Object.assign(t,{wins:0,losses:0,ties:0,pf:0,pa:0,gamesPlayed:0});ensureDepthChart(t,league.rules);}league.schedule=generateSchedule(league.teams,league.season);
}

function available(list){ return (list||[]).filter(p=>p.injuredGames<=0).sort((a,b)=>b.ratings.overall-a.ratings.overall); }
function ensureDepthChart(team,rules){
  if(team.depthChart&&team.depthChart.version===2)return team.depthChart;
  const d=depthChart(team.roster),ids=x=>(x||[]).map(p=>p.id),wr=available(d.WR).slice(0,2),ol=available(d.OL).slice(0,3),db=available(d.DB).slice(0,3),dl=available(d.DL).slice(0,2);
  return team.depthChart={version:2,offense:{QB:available(d.QB)[0]?.id||null,FB:available(d.FB)[0]?.id||null,WR:ids(wr),OL:ids(ol),motion:wr[0]?.id||null},
    defense:{DB:ids(db),DL:ids(dl),LB:available(d.LB)[0]?.id||null,jack:available(d.LB)[0]?.id||null,mac:available(d.LB)[0]?.id||null},
    special:{K:available(d.K)[0]?.id||null,returner:wr.slice().sort((a,b)=>(b.ratings.speed||0)-(a.ratings.speed||0))[0]?.id||null}};
}
function starters(team,rules){
  const chart=ensureDepthChart(team,rules),byId=new Map(team.roster.map(p=>[p.id,p])),healthy=team.roster.filter(p=>p.rosterStatus!=='inactive'&&(p.injuredGames||0)<=0);
  const get=id=>{const p=byId.get(id);return p&&healthy.includes(p)?p:null;},gets=arr=>(arr||[]).map(get).filter(Boolean),fallback=(pos,n=1)=>healthy.filter(p=>p.position===pos).sort((a,b)=>b.ratings.overall-a.ratings.overall).slice(0,n);
  const one=(preferred,pos)=>get(preferred)||fallback(pos,1)[0]||null, many=(preferred,pos,n)=>{const chosen=gets(preferred);for(const p of fallback(pos,n))if(chosen.length<n&&!chosen.some(x=>x.id===p.id))chosen.push(p);return chosen.slice(0,n);};
  const wr=many(chart.offense.WR,'WR',2),ol=many(chart.offense.OL,'OL',3),db=many(chart.defense.DB,'DB',3),dl=many(chart.defense.DL,'DL',2);
  const out={qb:one(chart.offense.QB,'QB'),fb:one(chart.offense.FB,'FB'),wr,ol,k:one(chart.special.K,'K'),returner:get(chart.special.returner)||wr.slice().sort((a,b)=>effective(b,'speed')-effective(a,'speed'))[0]||one(chart.offense.FB,'FB'),motionReceiver:get(chart.offense.motion)||wr[0]||null,
    db,dl,lb:one(chart.defense.LB,'LB'),jack:one(chart.defense.jack,'LB'),mac:one(chart.defense.mac,'LB')};
  if(rules.ironman||rules.personnel?.ironman){out.db=[...out.wr,...out.db].filter(Boolean).slice(0,3);out.dl=[...out.ol,...out.dl].filter(Boolean).slice(0,2);out.lb=out.fb||out.lb;out.jack=out.lb||out.jack;out.mac=out.lb||out.mac;}
  return out;
}
function avg(list,key='overall',fallback=45){
  const vals=(list||[]).filter(Boolean).map(p=>p.ratings?.[key]??p.ratings?.overall??fallback);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:fallback;
}
function fatiguePenalty(p){ return p?Math.min(16,(p.fatigue||0)*0.22):8; }
function effective(p,key='overall'){ return p?clamp((p.ratings?.[key]??p.ratings?.overall??45)-fatiguePenalty(p),20,99):35; }
function addStat(p,key,n=1){ if(p){p.stats??=emptyStats();p.stats[key]=(p.stats[key]||0)+n;} }
function teamSideBox(teamId,home,box){ return teamId===home.id?box.home:box.away; }
function normalizeRules(rules){
  const old=rules||{},r={...deepClone(DEFAULT_RULES),...old};
  r.field={...DEFAULT_RULES.field,...(old.field||{}),length:old.fieldLength??old.field?.length??50,width:old.fieldWidth??old.field?.width??28,endZoneDepth:old.endZoneLength??old.field?.endZoneDepth??8,walls:(old.wallsInPlay??true)?'live':'boundary'};
  r.personnel={...DEFAULT_RULES.personnel,...(old.personnel||{}),playersPerSide:old.playersOnField??old.personnel?.playersPerSide??8,ironman:old.ironman??old.personnel?.ironman??true,motionPlayers:old.secondMotionMan?2:(old.motion?.offensivePlayers??1),highMotion:old.highMotion??old.personnel?.highMotion??true};
  r.defense={...DEFAULT_RULES.defense,...(old.defense||{}),jackRestriction:old.jackRestrictions??old.defense?.jackRestriction??'classic'};
  r.kicking={...deepClone(DEFAULT_RULES.kicking),...(old.kicking||{}),punting:old.punting??old.kicking?.punting??false,reboundNets:old.reboundNets??old.kicking?.reboundNets??true,dropKicks:old.dropKicks??old.kicking?.dropKicks??true,halo:old.halo??old.kicking?.halo??true};
  r.kicking.deuce={...DEFAULT_RULES.kicking.deuce,...(old.kicking?.deuce||{}),enabled:old.deuce??old.kicking?.deuce?.enabled??true};r.kicking.uno={...DEFAULT_RULES.kicking.uno,...(old.kicking?.uno||{}),enabled:old.uno??old.kicking?.uno?.enabled??false};r.kicking.rouge={...DEFAULT_RULES.kicking.rouge,...(old.kicking?.rouge||{}),enabled:old.rouge??old.kicking?.rouge?.enabled??true};
  r.motion={...DEFAULT_RULES.motion,...(old.motion||{}),offensivePlayers:r.personnel.motionPlayers,forwardMotionAllowed:old.highMotion??old.motion?.forwardMotionAllowed??true};r.clock={...DEFAULT_RULES.clock,...(old.clock||{}),runningClock:old.runningClock??old.clock?.runningClock??true};
  r.overtime={...DEFAULT_RULES.overtime,...(old.overtime||{})};r.penalties={...DEFAULT_RULES.penalties,...(old.penalties||{})};r.injuries={...DEFAULT_RULES.injuries,...(old.injuries||{})};r.scoring={...DEFAULT_RULES.scoring,...(old.scoring||{})};
  Object.assign(r,{fieldLength:r.field.length,fieldWidth:r.field.width,endZoneLength:r.field.endZoneDepth,playersOnField:r.personnel.playersPerSide,ironman:r.personnel.ironman,highMotion:r.personnel.highMotion,reboundNets:r.kicking.reboundNets,punting:r.kicking.punting,dropKicks:r.kicking.dropKicks,deuce:r.kicking.deuce.enabled,uno:r.kicking.uno.enabled,rouge:r.kicking.rouge.enabled,halo:r.kicking.halo,jackRestrictions:r.defense.jackRestriction});
  return r;
}
function scoreDiff(state,teamId,home){ return teamId===home.id?state.homeScore-state.awayScore:state.awayScore-state.homeScore; }
const OFFENSE_CONCEPTS={
  RUN_POWER:{family:'run',lane:'inside',label:'Power',runBlock:+3,breakTackle:+2},
  RUN_SWEEP:{family:'run',lane:'outside',label:'Sweep',runBlock:-1,space:+4},
  DRAW:{family:'run',lane:'inside',label:'Draw',runBlock:+1,vsBlitz:+7},
  SLANT:{family:'pass',depth:'short',label:'Slant',release:+4,vsMan:+5,vsBlitz:+3},
  QUICK_OUT:{family:'pass',depth:'short',label:'Quick Out',release:+3,vsZone:+3,outBounds:.38},
  CROSS:{family:'pass',depth:'medium',label:'Cross',vsMan:+4,yac:+3},
  CORNER:{family:'pass',depth:'medium',label:'Corner',vsZone:+5,catchPenalty:2},
  VERTICALS:{family:'pass',depth:'deep',label:'Verticals',vsMan:+2,explosive:+5},
  SCREEN:{family:'pass',depth:'screen',label:'Screen',vsBlitz:+9,yac:+5,passRushRelief:+7}
};
const DEFENSE_CALLS={
  MAN:{label:'Man',coverage:'man',coverageMod:1,pressureMod:0,runFit:0},
  ZONE:{label:'Zone',coverage:'zone',coverageMod:2,pressureMod:-1,runFit:0},
  BLITZ:{label:'Blitz',coverage:'man',coverageMod:-4,pressureMod:8,runFit:2},
  RUN_FIT:{label:'Run Fit',coverage:'zone',coverageMod:-2,pressureMod:1,runFit:7},
  RED_ZONE:{label:'Red Zone',coverage:'zone',coverageMod:5,pressureMod:2,runFit:3}
};
function playInfo(play){return OFFENSE_CONCEPTS[play]||OFFENSE_CONCEPTS.SLANT;}
function defensiveCall(state,rules){
  const red=state.yardLine>=rules.fieldLength-10;
  if(red)return weighted([['RED_ZONE',5],['MAN',2],['BLITZ',2],['RUN_FIT',1]]);
  if(state.down>=3&&state.toGo>=6)return weighted([['BLITZ',4],['ZONE',4],['MAN',2]]);
  if(state.toGo<=2)return weighted([['RUN_FIT',5],['MAN',3],['BLITZ',2]]);
  return weighted([['MAN',3],['ZONE',4],['BLITZ',2],['RUN_FIT',1]]);
}
function coachDecision(state,team,home,rules){
  const distGoal=rules.fieldLength-state.yardLine, diff=scoreDiff(state,team.id,home);
  const late=state.quarter>=4 && state.seconds<=180;
  if(state.down===rules.downs){
    const fgDist=distGoal+8, desperate=late&&diff<0;
    if(!desperate && fgDist<=34 && state.yardLine>=14)return (rules.dropKicks&&rules.fourPointDropFieldGoal&&random()<.08)?'DROP_FG':'FG';
    if(state.toGo<=3 || desperate || state.yardLine>=30)return state.toGo<=1?'RUN_POWER':weighted([['SLANT',4],['CROSS',3],['QUICK_OUT',2],['DRAW',1]]);
    return 'TURNOVER';
  }
  if(late&&diff<=-8)return weighted([['QUICK_OUT',3],['CROSS',5],['CORNER',3],['VERTICALS',2],['SCREEN',1]]);
  if(state.toGo>=11)return weighted([['CROSS',4],['CORNER',3],['VERTICALS',2],['SCREEN',2],['DRAW',1]]);
  if(state.down===3&&state.toGo>=6)return weighted([['SLANT',2],['CROSS',5],['CORNER',3],['VERTICALS',1],['SCREEN',1]]);
  if(state.yardLine>=rules.fieldLength-8)return weighted([['RUN_POWER',3],['SLANT',4],['QUICK_OUT',2],['CORNER',2],['DRAW',1]]);
  return weighted([['RUN_POWER',18],['RUN_SWEEP',11],['DRAW',5],['SLANT',20],['QUICK_OUT',13],['CROSS',17],['CORNER',8],['VERTICALS',5],['SCREEN',3]]);
}
function roleGrade(p,role){
  if(!p)return 35;const v=k=>effective(p,k);
  switch(role){
    case'passer':return .22*v('decision')+.18*v('awareness')+.16*v('passShort')+.16*v('passMedium')+.12*v('passDeep')+.10*v('armStrength')+.06*v('scramble');

function saveUniverse(u){
  const store=getStorage();
  if(store){ try{ store.setItem(KEY,JSON.stringify(u)); return true; }catch(e){} }
  return false;
}
function loadUniverse(){
  const store=getStorage();
  if(!store) return null;
  try { const raw=store.getItem(KEY); return raw?migrateUniverse(JSON.parse(raw)):null; } catch(e){ return null; }
}
function clearSave(){
  const store=getStorage();
  if(store){ try{store.removeItem(KEY);}catch(e){} }
}
function exportSave(){ return JSON.stringify(universe); }
function importSave(text){
  const parsed=JSON.parse(text);
  if(!parsed || !Array.isArray(parsed.leagues)) throw new Error('Invalid Arena Football GM save.');
  universe=migrateUniverse(parsed);
  persist();
  render();
}


let universe=loadUniverse();
if(!universe){ universe=createUniverse(); createLeague(universe,{name:'Arena Football League',teamCount:4}); saveUniverse(universe); }
let view='league'; let selectedTeamId=null; let selectedGameId=null;
const app=document.querySelector('#app'), tabs=document.querySelector('#tabs'), saveStatus=document.querySelector('#saveStatus');
const league=()=>universe.leagues.find(l=>l.id===universe.activeLeagueId)||universe.leagues[0];
function persist(){
  const saved=saveUniverse(universe);
  saveStatus.textContent=saved ? ('Saved '+new Date().toLocaleTimeString()) : 'Session only';
}
function h(s){return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');}
function nav(){
  tabs.innerHTML=['league','standings','schedule','team','game','universe'].map(x=>`<button data-view="${x}" class="${view===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});
}
function render(){ nav(); const l=league(); if(!l){app.innerHTML='<p>No league.</p>';return;} ({league:renderLeague,standings:renderStandings,schedule:renderSchedule,team:renderTeam,game:renderGame,universe:renderUniverse}[view])(); }
function renderLeague(){ const l=league(); const next=l.schedule.find(g=>!g.played); app.innerHTML=`
  <div class="card"><h2>${h(l.name)} — ${l.season}</h2><p class="muted">${l.teams.length} teams · ${l.rules.fieldLength}-yard field · ${l.rules.playersOnField}-man football · Sim Engine v0.4</p>
  <div class="actions"><button id="simNext" ${!next?'disabled':''}>Sim Next Game</button><button id="simWeek">Sim All Remaining</button><button id="advance" ${next?'disabled':''}>Advance Season</button></div></div>
  <div class="grid">${l.teams.map(t=>`<div class="card"><h3>${h(t.name)}</h3><div class="score">${t.wins}-${t.losses}</div><p>PF ${t.pf} · PA ${t.pa}</p><button class="openTeam" data-id="${t.id}">Open Team</button></div>`).join('')}</div>`;
  document.querySelectorAll('.openTeam').forEach(b=>b.onclick=()=>{selectedTeamId=b.dataset.id;view='team';render();});
  document.querySelector('#simNext').onclick=()=>{simGame(next);};
  document.querySelector('#simWeek').onclick=()=>{for(const g of l.schedule.filter(g=>!g.played)) simGame(g,false);persist();render();};
  document.querySelector('#advance').onclick=()=>{try{advanceSeason(l);persist();render();}catch(e){alert(e.message);}};
}
function renderStandings(){ const l=league(); app.innerHTML=`<div class="card"><h2>Standings</h2><table><thead><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th></tr></thead><tbody>${standings(l).map(t=>`<tr><td>${h(t.name)}</td><td>${t.wins}</td><td>${t.losses}</td><td>${t.ties}</td><td>${t.pf}</td><td>${t.pa}</td></tr>`).join('')}</tbody></table></div>`; }
function renderSchedule(){ const l=league(); app.innerHTML=`<div class="card"><h2>${l.season} Schedule</h2><table><tbody>${l.schedule.map(g=>{const H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId);return `<tr><td>G${g.week}</td><td>${h(A.abbr)} @ ${h(H.abbr)}</td><td>${g.played?`${g.awayScore}-${g.homeScore}`:`<button class="sim" data-id="${g.id}">Sim</button>`}</td><td>${g.played?`<button class="box" data-id="${g.id}">View</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`;
  document.querySelectorAll('.sim').forEach(b=>b.onclick=()=>simGame(l.schedule.find(g=>g.id===b.dataset.id)));
  document.querySelectorAll('.box').forEach(b=>b.onclick=()=>{selectedGameId=b.dataset.id;view='game';render();});
}
function renderTeam(){ const l=league(); const t=l.teams.find(x=>x.id===selectedTeamId)||l.teams[0]; selectedTeamId=t.id; app.innerHTML=`<div class="card"><h2>${h(t.name)}</h2><p>${t.wins}-${t.losses}-${t.ties} · PF ${t.pf} · PA ${t.pa}</p></div><div class="card"><h3>Roster</h3><table><thead><tr><th>Pos</th><th>Player</th><th>Age</th><th>OVR</th><th>SPD</th><th>SKL</th><th>FAT</th></tr></thead><tbody>${[...t.roster].sort((a,b)=>a.position.localeCompare(b.position)||b.ratings.overall-a.ratings.overall).map(p=>`<tr><td>${p.position}</td><td>${h(p.name)}</td><td>${p.age}</td><td>${p.ratings.overall}</td><td>${p.ratings.speed}</td><td>${p.ratings.skill}</td><td>${p.fatigue}</td></tr>`).join('')}</tbody></table></div>`; }
function renderGame(){ const l=league(); const g=l.schedule.find(x=>x.id===selectedGameId)||l.schedule.find(x=>x.played); if(!g){app.innerHTML='<div class="card">No completed game yet.</div>';return;} const H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId),B=g.boxScore||{}; app.innerHTML=`<div class="card"><h2>${h(A.name)} @ ${h(H.name)}</h2><div class="score">${A.abbr} ${g.awayScore} — ${H.abbr} ${g.homeScore}</div><p class="muted">Simulation engine ${g.engineVersion||'legacy'} · ${(g.drives||[]).length} drives · stats derived from event log</p></div><div class="grid"><div class="card"><h3>Team stats</h3><table><tr><th></th><th>${A.abbr}</th><th>${H.abbr}</th></tr><tr><td>First downs</td><td>${B.away?.firstDowns??'-'}</td><td>${B.home?.firstDowns??'-'}</td></tr><tr><td>Total yards</td><td>${B.away?.totalYds??'-'}</td><td>${B.home?.totalYds??'-'}</td></tr><tr><td>Rush yards</td><td>${B.away?.rushYds??'-'}</td><td>${B.home?.rushYds??'-'}</td></tr><tr><td>Pass yards</td><td>${B.away?.passYds??'-'}</td><td>${B.home?.passYds??'-'}</td></tr><tr><td>Turnovers</td><td>${B.away?.turnovers??'-'}</td><td>${B.home?.turnovers??'-'}</td></tr><tr><td>Sacks allowed</td><td>${B.away?.sacksAllowed??'-'}</td><td>${B.home?.sacksAllowed??'-'}</td></tr><tr><td>Penalties</td><td>${B.away?.penalties??'-'}-${B.away?.penaltyYds??'-'}</td><td>${B.home?.penalties??'-'}-${B.home?.penaltyYds??'-'}</td></tr><tr><td>Kick return yards</td><td>${B.away?.kickReturnYds??'-'}</td><td>${B.home?.kickReturnYds??'-'}</td></tr></table></div></div><div class="card"><h3>Play-by-play</h3><div class="log">${(g.events||[]).map(e=>h(eventText(e))).join('<br>')}</div></div>`; }
function renderUniverse(){ app.innerHTML=`<div class="card"><h2>Universe</h2><p>${h(universe.name)}</p><label>Active league <select id="leagueSelect">${universe.leagues.map(l=>`<option value="${l.id}" ${l.id===universe.activeLeagueId?'selected':''}>${h(l.name)} (${l.season})</option>`).join('')}</select></label></div><div class="card"><h3>Save & League Tools</h3><div class="actions"><button id="addLeague">Add League</button><button id="saveNow">Save Now</button><button id="exportSave">Export Save</button><button id="importSave">Import Save</button><button id="reset">Reset Universe</button></div><p class="muted">${storageAvailable?'This browser allows automatic local saves.':'iOS local-file mode blocks automatic browser storage here. The game still works for this session; use Export Save before closing and Import Save when you return.'}</p><textarea id="saveBox" style="width:100%;min-height:120px;margin-top:10px;background:#0d1525;color:#f3f4f6;border:1px solid #3b4a66;border-radius:8px;padding:10px;box-sizing:border-box" placeholder="Exported save data appears here. Paste save data here to import."></textarea></div>`;
 document.querySelector('#leagueSelect').onchange=e=>{universe.activeLeagueId=e.target.value;persist();render();};
 document.querySelector('#addLeague').onclick=()=>{createLeague(universe,{name:`Arena League ${universe.leagues.length+1}`,teamCount:4});persist();render();};
 document.querySelector('#saveNow').onclick=()=>persist();
 document.querySelector('#exportSave').onclick=()=>{const box=document.querySelector('#saveBox');box.value=exportSave();box.focus();box.select();saveStatus.textContent='Save exported';};
 document.querySelector('#importSave').onclick=()=>{const box=document.querySelector('#saveBox');try{importSave(box.value);saveStatus.textContent='Save imported';}catch(e){alert(e.message);}};
 document.querySelector('#reset').onclick=()=>{if(confirm('Delete this universe?')){clearSave();universe=createUniverse();createLeague(universe,{name:'Arena Football League',teamCount:4});persist();render();}};
}
function simGame(g,rerender=true){ if(!g||g.played)return; const l=league(),H=l.teams.find(t=>t.id===g.homeId),A=l.teams.find(t=>t.id===g.awayId); const res=simulateGame(H,A,l.rules,{seed:g.seed}); recordResult(l,g,res); selectedGameId=g.id; persist(); if(rerender){view='game';render();} }
saveStatus.textContent=storageAvailable?'Ready · auto-save on':'Ready · session save';
render();
</script>
</body>
</html>
